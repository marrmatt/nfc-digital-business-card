name: Prototype static tests

on:
  push:
    branches:
      - main
      - 'prototype-hardening/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-tests:
    name: Node.js source regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Run static regression tests
        run: node --test tests/prototype-static.test.mjs
